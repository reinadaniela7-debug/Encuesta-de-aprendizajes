<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa Saturno · Aprendizajes del ciclo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&family=Newsreader:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{--bg:#F0EEE6;--card:#FBFAF6;--fg:#26302A;--mute:#6B7A6F;--line:#DEDDD2;--green:#3A6B2A;--leaf:#5A9A3C;--gold:#9A7B2F;--sel:#E8EFDF;--bad:#A3361A;--serif:'Newsreader',Georgia,serif;--sans:'Hanken Grotesk',system-ui,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:18px;line-height:1.45;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(20px,env(safe-area-inset-left,0px)) 10px}
.brand{font-family:var(--serif);font-size:22px;font-weight:500}.brand b{color:var(--leaf);font-weight:500;font-style:italic}
.count{font-size:14px;color:var(--mute)}
.prog{height:4px;background:var(--line);margin:0 max(20px,env(safe-area-inset-left,0px));border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .25s}
.scroll{flex:1;overflow-y:auto;padding:28px max(20px,env(safe-area-inset-left,0px)) 24px}
.stage{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.stage>*{min-width:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.18;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0}
.hint{font-size:15px;color:var(--mute);margin:0}
.big{font-size:20px}
input[type=text],textarea{width:100%;font:inherit;font-size:19px;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px}
input[type=text]:focus,textarea:focus{border-color:var(--green);outline:none}
textarea{min-height:150px;resize:vertical}
.porque{display:flex;flex-direction:column;gap:18px}.porque .sub{display:flex;flex-direction:column;gap:8px}.porque textarea{min-height:90px}.pl{font-weight:600;font-size:17px}
.row{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.row textarea{width:100%}
.mic{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--green);border:1.5px solid var(--green);border-radius:12px;padding:12px 20px;cursor:pointer}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mic svg{width:18px;height:18px;fill:currentColor}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.one{grid-template-columns:1fr}
.choice{font:inherit;font-size:19px;font-weight:600;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px 12px;cursor:pointer;text-align:center}
.choice.on{background:var(--green);border-color:var(--green);color:#fff}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.scale button{font:inherit;font-size:22px;font-weight:600;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 0;cursor:pointer}
.scale button.on{background:var(--green);border-color:var(--green);color:#fff}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mute)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--mute)}
summary{cursor:pointer;font-weight:600;color:var(--green)}
details p{margin:8px 0 0}
.grp{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:14px 0 2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:17px}
.opt:has(input:checked){background:var(--sel);border-color:var(--green)}
.opt.off{opacity:.4;cursor:not-allowed}
.opt input{width:22px;height:22px;accent-color:var(--green);flex:none}
.pick{font-size:15px;font-weight:600;color:var(--green);margin:0}
.chosen{background:var(--sel);border-radius:12px;padding:12px 14px;font-size:15px}
.chosen b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.nav .mid{font-size:13px;color:var(--mute);text-align:center;flex:1}
.nav .mid b{color:var(--green);font-weight:600}
button.next,button.back{font:inherit;font-size:18px;font-weight:600;border-radius:14px;padding:15px 26px;cursor:pointer;border:0}
button.next{background:var(--green);color:#fff;min-width:140px}
button.next:disabled{background:#B9C4B3;cursor:default}
button.back{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.msg{color:var(--bad);font-size:15px;margin:0}
.done{display:flex;flex-direction:column;gap:12px;padding-top:40px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:420px){.scale{grid-template-columns:repeat(4,1fr)}button.next{min-width:0;flex:1}}
</style>
</head>
<body>
<div class="top"><div class="brand">Programa <b>Saturno</b></div><div class="count" id="count"></div></div>
<div class="prog"><i id="bar"></i></div>
<div class="scroll"><div class="stage" id="stage"></div></div>
<div class="nav" id="nav"><button class="back" id="back" type="button">Atrás</button><div class="mid" id="mid"></div><button class="next" id="next" type="button">Siguiente</button></div>

<script>
/* ===== Configuración ===== */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxrC2bJJF1R4AU1J7Dnn24GPOE48fG_GhP_DAYdBsw8vi17zhuflgdz21eUb3snNiycFA/exec';
var DRAFT_KEY = 'saturno_borrador_v2';

/* ===== Datos del cronograma ===== */
var PROCESOS = {"procesos": ["Planificación · Captación de Productores", "Planificación · Acuerdo de Especificación con Laboratorio", "Planificación · Planificación Operativa Agrícola", "Planificación · Análisis de suelo en laboratorio UCV", "Planificación · Propuesta de Plan Agronómico", "Planificación · Mesas Técnicas (Agricultor)", "Planificación · Mesas Técnicas (Plan Agrícola)", "Ejecución · Mesas Técnicas del Ciclo (rutina semanal) (rutina)"], "conocimiento": ["Planificación · Formaciones", "Planificación · Planificación I+D", "Ejecución · Comunicación con el Productor (rutina)", "Ejecución · Evento Sinergia I", "Ejecución · Preparación Siembra (maquinaria, insumos, gente)", "Ejecución · Siembra RDOE", "Cierre · Cosecha RDOE", "Cierre · Cierre RDOE - Aprendizajes y Recomendaciones", "Cierre · Evento Sinergia II", "Cierre · Reconocimiento a la Excelencia Técnica"], "administrativo": ["Planificación · Dimensionamiento y Metas de Negocio Agrícola", "Planificación · Negociación Bancaria", "Planificación · Oferta Proveedores", "Planificación · Compra y Asignación de Activos", "Planificación · Recolección de Documentación para Créditos", "Planificación · Corrida de Plan de Negocio y P&L por Agricultor", "Planificación · Entrega de Documentos Legales", "Planificación · Negociación y Cierre con Proveedores", "Ejecución · Monitoreo de P&L (rutina)", "Ejecución · Convenio con el Agricultor", "Ejecución · Liquidación de Crédito", "Ejecución · Actualización de Documentos - Movimientos de Maiz", "Ejecución · Definición de Mecanismo de Recaudo de Crédito en Cosecha", "Ejecución · Logística Interna de Arrime", "Cierre · Cierre de Proveedores", "Cierre · Cierre por Agricultor", "Cierre · Aprendizajes Proyecto Integral", "Cierre · Cierre Polar"], "operativo": ["Planificación · Levantamiento de polígono y delimitación de lotes", "Planificación · Plan de muestreo de suelo y toma de muestra en campo", "Siembra · Auditoría Transversal del Ciclo (rutina)", "Siembra · Descompactación, Nivelación y Drenaje", "Siembra · Encalado", "Siembra · Asignación de Insumos", "Siembra · Suministro de Insumos", "Siembra · Cierre de Inventario - Fase 1 (post-siembra)", "Siembra · Siembra", "Siembra · Análisis Foliar de Verificación", "Siembra · Control de Cultivo/Fumigación", "Siembra · Monitoreo", "Siembra · Reabono de Cultivo", "Cosecha · Cierre de Inventario - Fase 2 (antesala de cosecha)", "Cosecha · Estimación de Cosecha", "Cosecha · Cosecha", "Cosecha · Preparación Cosecha (maquinaria, insumos, gente)"]};
var PROCESOS_FASE = {"administrativo": {"Planificación": ["Dimensionamiento y Metas de Negocio Agrícola", "Negociación Bancaria", "Oferta Proveedores", "Compra y Asignación de Activos", "Recolección de Documentación para Créditos", "Corrida de Plan de Negocio y P&L por Agricultor", "Entrega de Documentos Legales", "Negociación y Cierre con Proveedores"], "Siembra": ["Monitoreo de P&L", "Convenio con el Agricultor", "Liquidación de Crédito"], "Cosecha": ["Actualización de Documentos - Movimientos de Maiz", "Definición de Mecanismo de Recaudo de Crédito en Cosecha", "Cierre de Proveedores", "Logística Interna de Arrime", "Cierre por Agricultor", "Aprendizajes Proyecto Integral", "Cierre Polar"]}, "operativo": {"Planificación": ["Levantamiento de polígono y delimitación de lotes", "Plan de muestreo de suelo y toma de muestra en campo"], "Siembra": ["Auditoría Transversal del Ciclo", "Descompactación, Nivelación y Drenaje", "Encalado", "Asignación de Insumos", "Suministro de Insumos", "Cierre de Inventario - Fase 1 (post-siembra)", "Siembra", "Análisis Foliar de Verificación", "Control de Cultivo/Fumigación", "Monitoreo", "Reabono de Cultivo"], "Cosecha": ["Cierre de Inventario - Fase 2 (antesala de cosecha)", "Estimación de Cosecha", "Cosecha", "Preparación Cosecha (maquinaria, insumos, gente)"]}, "procesos": {"Planificación": ["Captación de Productores", "Acuerdo de Especificación con Laboratorio", "Planificación Operativa Agrícola", "Análisis de suelo en laboratorio UCV", "Propuesta de Plan Agronómico", "Mesas Técnicas (Agricultor)", "Mesas Técnicas (Plan Agrícola)"], "Siembra": ["Mesas Técnicas del Ciclo"], "Cosecha": []}, "conocimiento": {"Planificación": ["Formaciones", "Planificación I+D"], "Siembra": ["Comunicación con el Productor", "Evento Sinergia I", "Preparación Siembra (maquinaria, insumos, gente)", "Siembra RDOE"], "Cosecha": ["Cosecha RDOE", "Cierre RDOE - Aprendizajes y Recomendaciones", "Evento Sinergia II", "Reconocimiento a la Excelencia Técnica"]}};
var AREAS = [['administrativo', 'Administrativo'], ['operativo', 'Operativo'], ['procesos', 'Procesos'], ['conocimiento', 'Conocimiento']];
var FASES = ['Planificación', 'Siembra', 'Cosecha'];
var NPS_KEYS = {'Planificación': 'nps_planificacion', 'Siembra': 'nps_siembra', 'Cosecha': 'nps_cosecha'};

/* Operativo, Siembra: cuatro procesos resumidos, iguales en el recordatorio y en la selección */
(function () {
  var S = ['Calibración de sembradora', 'Ejecución del plan agronómico', 'Manejo del inventario', 'Rutinas de monitoreo'];
  PROCESOS_FASE.operativo['Siembra'] = S;
  var L = PROCESOS.operativo, pos = -1, out = [];
  L.forEach(function (x) { if (x.indexOf('Siembra · ') === 0) { if (pos < 0) pos = out.length; } else out.push(x); });
  if (pos < 0) pos = out.length;
  out.splice.apply(out, [pos, 0].concat(S.map(function (n) { return 'Siembra · ' + n; })));
  PROCESOS.operativo = out;
})();

/* ===== Estado y guardado automático ===== */
var state = {id: '', estado: 'borrador', step: 0};
var $ = function (id) { return document.getElementById(id); };
function uuid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
try { var saved = localStorage.getItem(DRAFT_KEY); if (saved) state = JSON.parse(saved); } catch (e) {}
if (!state.id) state.id = uuid();
state.step = state.step || 0;

var timer = null, pendiente = false, estadoTxt = '';
function persist() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {} }
function setMid(h) { $('mid').innerHTML = h; }
function touch() { persist(); pendiente = true; setMid('Guardando…'); clearTimeout(timer); timer = setTimeout(function () { enviar(); }, 1500); }
function enviar(final) {
  state.estado = final === true ? 'completa' : (state.estado === 'completa' ? 'completa' : 'borrador');
  return fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(state)})
    .then(function () { pendiente = false; setMid('<b>Guardado</b>'); return true; })
    .catch(function () { setMid('Guardado en tu dispositivo'); return false; });
}
window.addEventListener('online', function () { if (pendiente) enviar(); });

/* ===== Pasos ===== */
function nombreFase(f) { return f.toLowerCase(); }
function steps() {
  var a = state.area, s = [];
  s.push({k: 'intro', tipo: 'intro'});
  s.push({k: 'nombre', tipo: 'texto', t: '¿Cómo te llamas?', ph: 'Nombre y apellido'});
  s.push({k: 'area', tipo: 'area', t: '¿En qué área trabajas?'});
  if (!a) return s;
  FASES.forEach(function (f) { s.push({k: NPS_KEYS[f], tipo: 'nps', fase: f, t: '¿Recomendarías a otros proyectos el proceso de ' + nombreFase(f) + ' que ejecutaste este ciclo?'}); });
  s.push({k: 'bien', tipo: 'multi', t: '¿Cuáles 3 procesos funcionaron mejor?'});
  s.push({k: 'porque_bien', tipo: 'porque', t: '¿Por qué funcionaron bien?', h: 'Cuéntanos en una o dos líneas por cada proceso.', ctx: 'bien'});
  s.push({k: 'mal', tipo: 'multi', t: '¿Cuáles 3 procesos tuvieron más problemas?'});
  s.push({k: 'porque_mal', tipo: 'porque', t: '¿Qué pasó?', h: 'Cuéntanos en una o dos líneas por cada proceso.', ctx: 'mal'});
  s.push({k: 'reto', tipo: 'largo', t: '¿Cuál fue el mayor reto del ciclo?'});
  s.push({k: 'reto_fase', tipo: 'fase', t: '¿En qué fase ocurrió ese reto?'});
  s.push({k: 'reto_solucion', tipo: 'largo', t: '¿Cómo lo resolviste?', h: 'Si no lo resolviste, cuéntanos qué crees que podríamos hacer para mejorarlo el próximo año.'});
  s.push({k: 'distinto', tipo: 'largo', t: 'Si arrancáramos el ciclo de nuevo, ¿qué harías distinto?'});
  s.push({k: 'reconocer', tipo: 'largo', t: '¿A quién reconocerías y por qué?', h: 'Alguien cuyo aporte te ayudó a ti y al equipo este ciclo. Escribe su nombre y qué hizo.'});
  if (a === 'operativo') {
    s.push({k: 'op_programa', tipo: 'largo', t: '¿Qué es el programa Saturno en tus propias palabras?'});
    s.push({k: 'op_rol', tipo: 'largo', t: '¿Cómo le explicarías a alguien tu rol y responsabilidades como técnico?'});
  }
  return s;
}
function valido(p) {
  var v = state[p.k];
  if (p.tipo === 'intro') return true;
  if (p.tipo === 'multi') return (v || []).length >= 1;
  if (p.tipo === 'porque') { var ch = state[p.ctx] || [], dt = (state.det || {})[p.k] || {}; return ch.length > 0 && ch.every(function (x) { return (dt[x] || '').trim(); }); }
  if (p.tipo === 'nps') return v !== undefined && v !== '';
  return !!(v && String(v).trim());
}

/* ===== Dibujo ===== */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
var activo = null;
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

function dictado() {
  return [el('p', 'hint', 'Para hablar en vez de escribir, toca el micrófono del teclado de tu teléfono.')];
}

function irSiguienteSoft(paso) {
  setTimeout(function () { if (state.step === paso && valido(steps()[paso])) siguiente(); }, 260);
}

function render() {
    var S = steps();
  if (state.step >= S.length) state.step = S.length - 1;
  var p = S[state.step], st = $('stage');
  st.innerHTML = '';
  var total = S.length - 1;
  $('count').textContent = p.tipo === 'intro' ? '' : 'Pregunta ' + state.step + (state.area ? ' de ' + total : '');
  $('bar').style.width = (state.area ? state.step / total * 100 : state.step * 4) + '%';
  $('back').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  var ultimo = state.step === S.length - 1 && state.area;
  $('next').textContent = p.tipo === 'intro' ? 'Empezar' : (ultimo ? 'Enviar' : 'Siguiente');

  if (p.tipo === 'intro') {
    st.appendChild(el('p', 'eyebrow', 'Polar · Ciclo 2026'));
    st.appendChild(el('h1', '', 'Cuéntanos cómo te fue en el ciclo'));
    st.appendChild(el('p', 'big', 'Son pocas preguntas y toman menos de 5 minutos. Con tus respuestas preparamos la sesión de aprendizajes.'));
    st.appendChild(el('p', 'hint', 'Lo que escribes se guarda solo: puedes cerrar y seguir después desde este mismo dispositivo.'));
  } else {
    var h = el('h1', '', p.t);
    if (p.tipo === 'nps') { var q = p.t.split(nombreFase(p.fase)); h.textContent = q[0]; h.appendChild(el('strong', '', nombreFase(p.fase))); h.appendChild(document.createTextNode(q[1] || '')); }
    st.appendChild(h);
    if (p.h) st.appendChild(el('p', 'hint', p.h));
    if (p.tipo === 'texto') {
      var i = el('input'); i.type = 'text'; i.value = state[p.k] || ''; i.placeholder = p.ph || '';
      i.addEventListener('input', function () { state[p.k] = i.value; touch(); actualizarBoton(); });
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter' && valido(p)) siguiente(); });
      st.appendChild(i); setTimeout(function () { i.focus(); }, 50);
    } else if (p.tipo === 'largo') {
      if (p.ctx && (state[p.ctx] || []).length) {
        var c = el('div', 'chosen'); c.appendChild(el('b', '', 'Elegiste'));
        c.appendChild(document.createTextNode((state[p.ctx] || []).map(function (x) { return x.split(' · ').slice(1).join(' · '); }).join('; ')));
        st.appendChild(c);
      }
      var caja = el('div', 'row'), ta = el('textarea'); ta.value = state[p.k] || '';
      ta.addEventListener('input', function () { state[p.k] = ta.value; touch(); actualizarBoton(); });
      var ex = dictado(); caja.appendChild(ta); ex.forEach(function (x) { caja.appendChild(x); }); st.appendChild(caja);
    } else if (p.tipo === 'porque') {
      state.det = state.det || {}; state.det[p.k] = state.det[p.k] || {};
      var caja2 = el('div', 'porque');
      (state[p.ctx] || []).forEach(function (lab) {
        var g2 = el('div', 'sub'), tx = el('textarea');
        g2.appendChild(el('label', 'pl', lab.split(' · ').slice(1).join(' · ')));
        tx.value = state.det[p.k][lab] || '';
        tx.addEventListener('input', function () {
          state.det[p.k][lab] = tx.value;
          state[p.k] = (state[p.ctx] || []).map(function (x) { return x.split(' · ').slice(1).join(' · ') + ': ' + (state.det[p.k][x] || '').trim(); }).join('\n');
          touch(); actualizarBoton();
        });
        g2.appendChild(tx); caja2.appendChild(g2);
      });
      st.appendChild(caja2);
    } else if (p.tipo === 'area' || p.tipo === 'fase') {
      var opts = p.tipo === 'area' ? AREAS : FASES.map(function (f) { return [f, f]; });
      var g = el('div', 'choices' + (p.tipo === 'fase' ? ' one' : ''));
      opts.forEach(function (o) {
        var b = el('button', 'choice' + (state[p.k] === o[0] ? ' on' : ''), o[1]); b.type = 'button';
        b.addEventListener('click', function () {
          var cambio = state[p.k] !== o[0]; state[p.k] = o[0];
          if (p.tipo === 'area' && cambio) { state.bien = []; state.mal = []; }
          touch(); render(); irSiguienteSoft(state.step);
        });
        g.appendChild(b);
      });
      st.appendChild(g);
    } else if (p.tipo === 'nps') {
      var lista = PROCESOS_FASE[state.area][p.fase];
      var d = el('details'); d.open = true; d.appendChild(el('summary', '', '¿Cuáles procesos realizaste en esta fase?'));
      d.appendChild(el('p', '', lista.length ? lista.join('; ') + '.' : 'Tu área no tiene procesos propios en esta fase. Califica los procesos del programa que viste en ella.'));
      st.appendChild(d);
      var sc = el('div', 'scale');
      for (var n = 0; n <= 10; n++) (function (n) {
        var b = el('button', String(state[p.k]) === String(n) ? 'on' : '', String(n)); b.type = 'button';
        b.addEventListener('click', function () { state[p.k] = String(n); touch(); render(); irSiguienteSoft(state.step); });
        sc.appendChild(b);
      })(n);
      st.appendChild(sc);
      var e = el('div', 'ends'); e.appendChild(el('span', '', '0 = no lo recomendaría')); e.appendChild(el('span', '', '10 = sí lo recomendaría')); st.appendChild(e);
    } else if (p.tipo === 'multi') {
      var sel = state[p.k] || [], cont = el('div', 'opts'), pick = el('p', 'pick');
      var grupo = '';
      (PROCESOS[state.area] || []).forEach(function (lab) {
        var parts = lab.split(' · '), fase = parts[0], nombre = parts.slice(1).join(' · ');
        if (fase !== grupo) { grupo = fase; cont.appendChild(el('div', 'grp', fase)); }
        var l = el('label', 'opt'), i2 = el('input'); i2.type = 'checkbox'; i2.value = lab; i2.checked = sel.indexOf(lab) >= 0;
        l.appendChild(i2); l.appendChild(el('span', '', nombre)); cont.appendChild(l);
      });
      var refrescar = function () {
        var marc = [].slice.call(cont.querySelectorAll('input:checked')).map(function (x) { return x.value; });
        state[p.k] = marc; pick.textContent = 'Elegidos: ' + marc.length + ' de 3';
        [].forEach.call(cont.querySelectorAll('.opt'), function (l) { var i3 = l.querySelector('input'), off = marc.length >= 3 && !i3.checked; i3.disabled = off; l.classList.toggle('off', off); });
      };
      cont.addEventListener('change', function () { refrescar(); touch(); actualizarBoton(); });
      st.appendChild(pick); st.appendChild(cont); refrescar();
    }
  }
  actualizarBoton();
  if (pendiente) setMid('Guardando…');
  $('stage').parentNode.scrollTop = 0;
}
function actualizarBoton() { var p = steps()[state.step]; $('next').disabled = !valido(p); }

function siguiente() {
  var S = steps(), p = S[state.step];
  if (!valido(p)) return;
  if (state.step === S.length - 1 && state.area) { terminar(); return; }
  state.step++; touch(); render();
}
function terminar() {
  var b = $('next'); b.disabled = true; b.textContent = 'Enviando…';
  enviar(true).then(function (ok) {
    if (!ok) { b.disabled = false; b.textContent = 'Enviar'; setMid('<span style="color:var(--bad)">No se pudo enviar. Tus respuestas están guardadas; inténtalo de nuevo con conexión.</span>'); return; }
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    $('nav').hidden = true; $('count').textContent = ''; $('bar').style.width = '100%';
    var st = $('stage'); st.innerHTML = '';
    var d = el('div', 'done'); d.appendChild(el('p', 'eyebrow', 'Listo'));
    d.appendChild(el('h1', '', 'Gracias, ' + (state.nombre || '').split(' ')[0]));
    d.appendChild(el('p', 'big', 'Recibimos tus respuestas. Nos vemos en la sesión de aprendizajes.'));
    st.appendChild(d);
  });
}
$('next').addEventListener('click', siguiente);
$('back').addEventListener('click', function () { if (state.step > 0) { state.step--; persist(); render(); } });

render();
</script>

<script>
(function(){
var PANEL_HTML = "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<title>Saturno · Resumen de respuestas<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap\">\n<style>\n:root{--bg:#F0EEE6;--panel:#F9F8F4;--fg:#26302A;--mute:#6B7A6F;--line:#DEDDD2;--green:#3A6B2A;--leaf:#5A9A3C;--gold:#9A7B2F;--sel:#E8EFDF;--bad:#A3361A;--mid:#B7A04A;--serif:'Newsreader',Georgia,serif;--sans:'Hanken Grotesk',system-ui,Arial,sans-serif;color-scheme:light}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5}\n.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}\n.brand{font-family:var(--serif);font-size:24px;font-weight:500}.brand b{color:var(--leaf);font-weight:500;font-style:italic}\n.top span{font-size:13px;color:var(--mute)}\n.wrap{max-width:1080px;margin:0 auto;padding:32px max(20px,env(safe-area-inset-left,0px)) 80px}\nh1{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 6px}\nh2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px}\nh3{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}\n.mute{color:var(--mute);font-size:14px;margin:0}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}\n.login{max-width:420px;margin:48px auto;display:flex;flex-direction:column;gap:12px}\ninput[type=password],input[type=text],select{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}\nbutton{font:inherit;font-weight:600;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}\nbutton.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}\n.msg{color:var(--bad);font-size:14px;margin:0;min-height:1.2em}\n.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:20px 0}\n.bar label{display:flex;align-items:center;gap:8px;font-size:14px}\n.bar select{width:auto;padding:10px 12px}\n.grid{display:grid;gap:16px;margin-bottom:16px}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g2{grid-template-columns:1fr 1fr}\n.nps{font-family:var(--serif);font-size:56px;line-height:1;margin:6px 0 10px}\n.nps.pos{color:var(--green)}.nps.neg{color:var(--bad)}\n.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}\n.stack i{display:block}\n.leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}\nth{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}\n.scroll{overflow-x:auto}\n.top5 div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}\n.top5 b{flex:none}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chip{font:inherit;font-size:14px;font-weight:400;background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px}\n.chip.on{background:var(--green);color:#fff;border-color:var(--green)}\n.chip small{color:var(--mute);margin-left:4px}.chip.on small{color:#dfe9d8}\n.com{border-top:1px solid var(--line);padding:12px 0}\n.com p{margin:4px 0 0}\n.badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--green);background:var(--sel);border-radius:6px;padding:2px 8px;margin-right:6px}\n.badge.f{color:var(--gold);background:#F1EAD3}\nmark{background:#F1EAD3;color:inherit}\n.ask{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n@media (max-width:800px){.g3,.g2{grid-template-columns:1fr}.top{padding:0 16px}}\n:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n<\/style>\n<\/head>\n<body>\n<div class=\"top\"><div class=\"brand\">Programa <b>Saturno<\/b><\/div><span>Panel privado<\/span><\/div>\n<div class=\"wrap\">\n\n<p class=\"msg\" id=\"loginMsg\" role=\"alert\"><\/p>\n\n<section id=\"panel\" hidden>\n<h1>Resumen de respuestas<\/h1>\n<p class=\"mute\" id=\"meta\"><\/p>\n<div class=\"bar\">\n<label>Grupo <select id=\"fArea\"><option value=\"\">Todos los grupos<\/option><option value=\"administrativo\">Administrativo<\/option><option value=\"operativo\">Operativo<\/option><option value=\"procesos\">Procesos<\/option><option value=\"conocimiento\">Conocimiento<\/option><\/select><\/label>\n<label><input type=\"checkbox\" id=\"fBorr\"> Incluir borradores<\/label>\n<label><input type=\"checkbox\" id=\"fNom\"> Mostrar nombres<\/label>\n<button class=\"ghost\" id=\"recargar\" type=\"button\">Actualizar<\/button>\n<\/div>\n\n<h3>NPS por fase<\/h3>\n<div class=\"grid g3\" id=\"npsFases\"><\/div>\n<div class=\"card scroll\" style=\"margin-bottom:16px\"><h3>NPS por grupo y fase<\/h3><table id=\"npsAreas\"><\/table><\/div>\n\n<div class=\"grid g2\">\n<div class=\"card\"><h3>Procesos que mejor funcionaron<\/h3><div class=\"top5\" id=\"topBien\"><\/div><\/div>\n<div class=\"card\"><h3>Procesos con más problemas<\/h3><div class=\"top5\" id=\"topMal\"><\/div><\/div>\n<\/div>\n\n<div class=\"card\" style=\"margin-bottom:16px\">\n<h3>Temas que más se repiten<\/h3>\n<p class=\"mute\" style=\"margin-bottom:10px\">Palabras que aparecen en los comentarios, por número de personas. Toca una para ver solo esos comentarios.<\/p>\n<div class=\"chips\" id=\"temas\"><\/div>\n<\/div>\n\n<div class=\"card\" style=\"margin-bottom:16px\">\n<h3>Resumen con IA<\/h3>\n<p class=\"mute\" style=\"margin-bottom:10px\">La página cuenta y agrupa sola, pero no redacta resúmenes. Copia los comentarios del filtro actual, con una instrucción lista, y pégalos en Claude para obtener los aprendizajes más importantes.<\/p>\n<div class=\"ask\"><button id=\"copiar\" type=\"button\">Copiar comentarios para resumir<\/button><span class=\"mute\" id=\"copiado\"><\/span><\/div>\n<\/div>\n\n<div class=\"card\"><h3>Comentarios <span id=\"filtroTema\" class=\"mute\"><\/span><\/h3><div id=\"comentarios\"><\/div><\/div>\n<\/section>\n<\/div>\n\n<script>\n/* Dirección de la aplicación web de Apps Script (la misma de la encuesta) */\nvar TOKEN = window.parent.__KEY || '';\nvar ENDPOINT = 'https://script.google.com/macros/s/AKfycbxrC2bJJF1R4AU1J7Dnn24GPOE48fG_GhP_DAYdBsw8vi17zhuflgdz21eUb3snNiycFA/exec';\nvar AREAS = {administrativo: 'Administrativo', operativo: 'Operativo', procesos: 'Procesos', conocimiento: 'Conocimiento'};\nvar FASES = [['nps_planificacion', 'Planificación'], ['nps_siembra', 'Siembra'], ['nps_cosecha', 'Cosecha']];\nvar PREGUNTAS = [\n  ['porque_bien', 'Por qué funcionaron bien'],\n  ['porque_mal', 'Qué pasó donde hubo problemas'],\n  ['reto', 'Mayor reto del ciclo'],\n  ['reto_solucion', 'Cómo lo resolvió / qué mejorar'],\n  ['distinto', 'Qué haría distinto'],\n  ['reconocer', 'A quién reconoce y por qué'],\n  ['op_programa', 'Qué es Saturno (equipo operativo)']\n];\nvar STOP = 'para como pero porque cuando donde desde hasta sobre entre este esta estos estas esto ese esa esos esas aquel muy mas menos tambien solo cada todo todos toda todas nada algo otro otra otros otras tiene tienen tener hacer hace hacen hecho hizo fue fueron sido ser estar esta estan estaba habia hay hubo sin con por los las del que una uno unos unas nos les sus mis tus nuestro nuestra nuestros nuestras ese eso puede pueden poder debe deben deberia bien mal ciclo programa saturno proceso procesos tuvo tuvieron reconozco reconocer reconoceria estuvo salio quiero queremos'.split(' ');\n\nvar $ = function (id) { return document.getElementById(id); };\nvar DATOS = [], tema = '';\n\nfunction sinTildes(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }\nfunction el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }\n\n/* ===== Acceso y carga ===== */\nfunction cargar() {\n  $('loginMsg').textContent = '';\n  if (!ENDPOINT || ENDPOINT.indexOf('PEGA_') === 0) { $('loginMsg').textContent = 'Falta pegar la dirección de Apps Script en esta página.'; return; }\n  fetch(ENDPOINT + '?accion=datos&token=' + encodeURIComponent(TOKEN))\n    .then(function (r) { return r.json(); })\n    .then(function (j) {\n      if (j.error) { $('panel').hidden = true; $('loginMsg').textContent = 'No se pudo leer: el código de Apps Script no coincide con esta página. Pega la versión nueva del código y vuelve a implementar.'; return; }\n      DATOS = j.datos || [];\n      $('panel').hidden = false;\n      pintar();\n    })\n    .catch(function () { $('loginMsg').textContent = 'No se pudo conectar. Revisa que la versión nueva del código esté implementada en Apps Script.'; });\n}\n$('recargar').addEventListener('click', cargar);\n['fArea', 'fBorr', 'fNom'].forEach(function (id) { $(id).addEventListener('change', pintar); });\n\n/* ===== Cálculos ===== */\nfunction filtradas() {\n  var a = $('fArea').value, borr = $('fBorr').checked;\n  return DATOS.filter(function (d) { return (!a || d.area === a) && (borr || d.estado === 'completa'); });\n}\nfunction nps(vals) {\n  var n = vals.length; if (!n) return null;\n  var p = 0, d = 0, m = 0;\n  vals.forEach(function (v) { if (v >= 9) p++; else if (v >= 7) m++; else d++; });\n  return {n: n, p: p, m: m, d: d, nps: Math.round((p - d) / n * 100), media: vals.reduce(function (s, v) { return s + v; }, 0) / n};\n}\nfunction notas(filas, k) {\n  return filas.map(function (f) { return f[k]; }).filter(function (v) { return v !== '' && v !== null && v !== undefined && !isNaN(Number(v)); }).map(Number);\n}\nfunction conteo(filas, k) {\n  var c = {};\n  filas.forEach(function (f) {\n    var l = f[k]; if (!l) return;\n    (Array.isArray(l) ? l : String(l).split(' | ')).forEach(function (p) { if (p) c[p] = (c[p] || 0) + 1; });\n  });\n  return Object.keys(c).map(function (p) { return [p, c[p]]; }).sort(function (a, b) { return b[1] - a[1]; });\n}\nfunction comentarios(filas) {\n  var out = [];\n  filas.forEach(function (f) {\n    PREGUNTAS.forEach(function (q) {\n      var t = (f[q[0]] || '').toString().trim();\n      if (t) out.push({area: f.area, nombre: f.nombre, k: q[0], pregunta: q[1], texto: t, fase: q[0] === 'reto' ? f.reto_fase : ''});\n    });\n  });\n  return out;\n}\nfunction temasDe(coms) {\n  var por = {}, vistos = {};\n  coms.forEach(function (c, i) {\n    var seen = {};\n    (c.texto.toLowerCase().match(/[\\p{L}]{4,}/gu) || []).forEach(function (w) {\n      var n = sinTildes(w);\n      if (STOP.indexOf(n) >= 0 || seen[n]) return;\n      seen[n] = 1;\n      var key = n; vistos[key] = vistos[key] || w;\n      por[key] = (por[key] || 0) + 1;\n    });\n  });\n  return Object.keys(por).filter(function (k) { return por[k] >= 2; }).map(function (k) { return [k, vistos[k], por[k]]; }).sort(function (a, b) { return b[2] - a[2]; }).slice(0, 24);\n}\n\n/* ===== Pintado ===== */\nfunction bloqueNps(titulo, r) {\n  var c = el('div', 'card');\n  c.appendChild(el('h3', '', titulo));\n  if (!r) { c.appendChild(el('p', 'mute', 'Sin respuestas todavía.')); return c; }\n  c.appendChild(el('div', 'nps ' + (r.nps > 0 ? 'pos' : r.nps < 0 ? 'neg' : ''), (r.nps > 0 ? '+' : '') + r.nps));\n  var s = el('div', 'stack');\n  [['d', 'var(--bad)'], ['m', 'var(--mid)'], ['p', 'var(--leaf)']].forEach(function (x) { var i = el('i'); i.style.width = (r[x[0]] / r.n * 100) + '%'; i.style.background = x[1]; s.appendChild(i); });\n  c.appendChild(s);\n  c.appendChild(el('div', 'leg', '')).innerHTML = '';\n  var l = c.lastChild; l.appendChild(el('span', '', r.d + ' detractores (0-6)')); l.appendChild(el('span', '', r.m + ' pasivos (7-8)')); l.appendChild(el('span', '', r.p + ' promotores (9-10)'));\n  c.appendChild(el('p', 'mute', 'Nota media ' + r.media.toFixed(1) + ' de 10 · ' + r.n + ' respuestas')).style.marginTop = '8px';\n  return c;\n}\nfunction pintar() {\n  var filas = filtradas(), mostrarNom = $('fNom').checked;\n  var comp = DATOS.filter(function (d) { return d.estado === 'completa'; }).length;\n  $('meta').textContent = filas.length + ' respuestas en el filtro · ' + comp + ' completas y ' + (DATOS.length - comp) + ' borradores en total';\n\n  var cont = $('npsFases'); cont.innerHTML = '';\n  FASES.forEach(function (f) { cont.appendChild(bloqueNps(f[1], nps(notas(filas, f[0])))); });\n\n  var t = $('npsAreas'); t.innerHTML = '';\n  var hd = el('tr'); ['Grupo'].concat(FASES.map(function (f) { return f[1]; })).concat(['Respuestas']).forEach(function (h) { hd.appendChild(el('th', '', h)); }); t.appendChild(hd);\n  var todas = filas;\n  Object.keys(AREAS).forEach(function (a) {\n    var fs = todas.filter(function (d) { return d.area === a; });\n    var tr = el('tr'); tr.appendChild(el('td', '', AREAS[a]));\n    FASES.forEach(function (f) { var r = nps(notas(fs, f[0])); tr.appendChild(el('td', '', r ? (r.nps > 0 ? '+' : '') + r.nps : '–')); });\n    tr.appendChild(el('td', '', String(fs.length))); t.appendChild(tr);\n  });\n\n  [['topBien', 'procesos_bien'], ['topMal', 'procesos_mal']].forEach(function (x) {\n    var box = $(x[0]); box.innerHTML = '';\n    var top = conteo(filas, x[1]).slice(0, 8);\n    if (!top.length) box.appendChild(el('p', 'mute', 'Sin datos.'));\n    top.forEach(function (p) { var d = el('div'); d.appendChild(el('span', '', p[0])); d.appendChild(el('b', '', String(p[1]))); box.appendChild(d); });\n  });\n\n  var coms = comentarios(filas);\n  var tm = temasDe(coms), tb = $('temas'); tb.innerHTML = '';\n  if (!tm.length) tb.appendChild(el('p', 'mute', 'Aún no hay suficientes comentarios para detectar temas.'));\n  tm.forEach(function (x) {\n    var b = el('button', 'chip' + (tema === x[0] ? ' on' : ''), x[1]); b.type = 'button';\n    b.appendChild(el('small', '', String(x[2])));\n    b.addEventListener('click', function () { tema = tema === x[0] ? '' : x[0]; pintar(); });\n    tb.appendChild(b);\n  });\n\n  var vis = tema ? coms.filter(function (c) { return sinTildes(c.texto).indexOf(tema) >= 0; }) : coms;\n  $('filtroTema').textContent = tema ? '· filtrando por \"' + tema + '\" (' + vis.length + ')' : '(' + vis.length + ')';\n  var cc = $('comentarios'); cc.innerHTML = '';\n  if (!vis.length) cc.appendChild(el('p', 'mute', 'No hay comentarios para este filtro.'));\n  PREGUNTAS.forEach(function (q) {\n    var lista = vis.filter(function (c) { return c.k === q[0]; });\n    if (!lista.length) return;\n    var h = el('h3', '', q[1] + ' (' + lista.length + ')'); h.style.marginTop = '18px'; cc.appendChild(h);\n    lista.forEach(function (c) {\n      var d = el('div', 'com');\n      var top = el('div'); top.appendChild(el('span', 'badge', AREAS[c.area] || c.area || 'Sin grupo'));\n      if (c.fase) top.appendChild(el('span', 'badge f', c.fase));\n      if (mostrarNom && c.nombre) top.appendChild(el('span', 'mute', c.nombre));\n      d.appendChild(top); d.appendChild(el('p', '', c.texto)); cc.appendChild(d);\n    });\n  });\n}\n\n/* ===== Copiar para resumir con IA ===== */\n$('copiar').addEventListener('click', function () {\n  var filas = filtradas(), coms = comentarios(filas), a = $('fArea').value;\n  var txt = 'Eres analista de aprendizajes. Estos son comentarios de una encuesta previa a la sesión de aprendizajes del Programa Saturno (agricultura, ciclo 2026). Cada comentario indica el grupo que lo escribió (' + (a ? AREAS[a] : 'todos los grupos') + ').\\n' +\n    'Resume: 1) los 5 aprendizajes más importantes, 2) los temas que se repiten entre grupos, 3) dónde hay discrepancias entre grupos, 4) en qué debería enfocarse la conversación de la sesión. Cita el grupo de origen en cada punto.\\n\\n';\n  PREGUNTAS.forEach(function (q) {\n    var l = coms.filter(function (c) { return c.k === q[0]; });\n    if (!l.length) return;\n    txt += '## ' + q[1] + '\\n';\n    l.forEach(function (c) { txt += '- [' + (AREAS[c.area] || c.area) + (c.fase ? ' · ' + c.fase : '') + '] ' + c.texto.replace(/\\s+/g, ' ') + '\\n'; });\n    txt += '\\n';\n  });\n  var ok = function () { $('copiado').textContent = 'Copiado (' + coms.length + ' comentarios).'; };\n  var no = function () { $('copiado').textContent = 'No se pudo copiar automáticamente.'; };\n  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, no); else no();\n});\n\ncargar();\n<\/script>\n<\/body>\n<\/html>\n";
function mostrar(){ var on = location.hash === '#panel-saturno'; $('adm').hidden = !on; if(!on){ $('admFrame').hidden=true; $('admFrame').srcdoc=''; $('admLogin').hidden=false; window.__KEY=''; return; }
  var k=''; try{k=localStorage.getItem('saturno_clave')||''}catch(e){}
  if(k){$('admKey').value=k; entrar();} else $('admKey').focus(); }
function cerrar(){ history.replaceState(null,'',location.pathname+location.search); mostrar(); }
function entrar(){ var k=$('admKey').value.trim(); if(!k) return; $('admMsg').textContent='';
  fetch(ENDPOINT+'?accion=datos&token='+encodeURIComponent(k)).then(function(r){return r.json()}).then(function(j){
    if(j.error){ $('admMsg').textContent='Clave incorrecta.'; try{localStorage.removeItem('saturno_clave')}catch(e){} return; }
    try{localStorage.setItem('saturno_clave',k)}catch(e){}
    window.__KEY=k; $('admLogin').hidden=true; $('admFrame').hidden=false; $('admFrame').srcdoc=PANEL_HTML;
  }).catch(function(){ $('admMsg').textContent='No se pudo conectar. Revisa tu internet.'; });
}
$('admGo').addEventListener('click',entrar); $('admX').addEventListener('click',cerrar);
$('admKey').addEventListener('keydown',function(e){if(e.key==='Enter')entrar()});
window.addEventListener('hashchange',mostrar); mostrar();
})();
</script>
