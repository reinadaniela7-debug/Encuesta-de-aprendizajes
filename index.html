<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa Saturno · Aprendizajes del ciclo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--bg:#F0EEE6;--card:#FBFAF6;--fg:#26302A;--mute:#6B7A6F;--line:#DEDDD2;--green:#3A6B2A;--leaf:#5A9A3C;--gold:#9A7B2F;--sel:#E8EFDF;--bad:#A3361A;--serif:'Newsreader',Georgia,serif;--sans:'Hanken Grotesk',system-ui,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:18px;line-height:1.45;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(20px,env(safe-area-inset-left,0px)) 10px}
.brand{font-family:var(--serif);font-size:22px;font-weight:500}.brand b{color:var(--leaf);font-weight:500;font-style:italic}
.count{font-size:14px;color:var(--mute)}
.prog{height:4px;background:var(--line);margin:0 max(20px,env(safe-area-inset-left,0px));border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .25s}
.scroll{flex:1;overflow-y:auto;padding:28px max(20px,env(safe-area-inset-left,0px)) 24px}
.stage{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.stage>*{min-width:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.18;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0}
.hint{font-size:15px;color:var(--mute);margin:0}
.big{font-size:20px}
input[type=text],textarea{width:100%;font:inherit;font-size:19px;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px}
input[type=text]:focus,textarea:focus{border-color:var(--green);outline:none}
textarea{min-height:150px;resize:vertical}
.row{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.row textarea{width:100%}
.mic{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:600;color:var(--green);background:transparent;border:1.5px solid var(--green);border-radius:12px;padding:10px 16px;cursor:pointer}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mic svg{width:18px;height:18px;fill:currentColor}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.one{grid-template-columns:1fr}
.choice{font:inherit;font-size:19px;font-weight:600;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px 12px;cursor:pointer;text-align:center}
.choice.on{background:var(--green);border-color:var(--green);color:#fff}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.scale button{font:inherit;font-size:22px;font-weight:600;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 0;cursor:pointer}
.scale button.on{background:var(--green);border-color:var(--green);color:#fff}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mute)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--mute)}
summary{cursor:pointer;font-weight:600;color:var(--green)}
details p{margin:8px 0 0}
.grp{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:14px 0 2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:17px}
.opt:has(input:checked){background:var(--sel);border-color:var(--green)}
.opt.off{opacity:.4;cursor:not-allowed}
.opt input{width:22px;height:22px;accent-color:var(--green);flex:none}
.pick{font-size:15px;font-weight:600;color:var(--green);margin:0}
.chosen{background:var(--sel);border-radius:12px;padding:12px 14px;font-size:15px}
.chosen b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.nav .mid{font-size:13px;color:var(--mute);text-align:center;flex:1}
.nav .mid b{color:var(--green);font-weight:600}
button.next,button.back{font:inherit;font-size:18px;font-weight:600;border-radius:14px;padding:15px 26px;cursor:pointer;border:0}
button.next{background:var(--green);color:#fff;min-width:140px}
button.next:disabled{background:#B9C4B3;cursor:default}
button.back{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.msg{color:var(--bad);font-size:15px;margin:0}
.done{display:flex;flex-direction:column;gap:12px;padding-top:40px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:420px){.scale{grid-template-columns:repeat(4,1fr)}button.next{min-width:0;flex:1}}
</style>
</head>
<body>
<div class="top"><div class="brand">Programa <b>Saturno</b></div><div class="count" id="count"></div></div>
<div class="prog"><i id="bar"></i></div>
<div class="scroll"><div class="stage" id="stage"></div></div>
<div class="nav" id="nav"><button class="back" id="back" type="button">Atrás</button><div class="mid" id="mid"></div><button class="next" id="next" type="button">Siguiente</button></div>

<script>
/* ===== Configuración ===== */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxrC2bJJF1R4AU1J7Dnn24GPOE48fG_GhP_DAYdBsw8vi17zhuflgdz21eUb3snNiycFA/exec';
var DRAFT_KEY = 'saturno_borrador_v2';

/* ===== Datos del cronograma ===== */
var PROCESOS = {"procesos": ["Planificación · Captación de Productores", "Planificación · Acuerdo de Especificación con Laboratorio", "Planificación · Planificación Operativa Agrícola", "Planificación · Análisis de suelo en laboratorio UCV", "Planificación · Propuesta de Plan Agronómico", "Planificación · Mesas Técnicas (Agricultor)", "Planificación · Mesas Técnicas (Plan Agrícola)", "Ejecución · Mesas Técnicas del Ciclo (rutina semanal) (rutina)"], "conocimiento": ["Planificación · Formaciones", "Planificación · Planificación I+D", "Ejecución · Comunicación con el Productor (rutina)", "Ejecución · Evento Sinergia I", "Ejecución · Preparación Siembra (maquinaria, insumos, gente)", "Ejecución · Siembra RDOE", "Cierre · Cosecha RDOE", "Cierre · Cierre RDOE - Aprendizajes y Recomendaciones", "Cierre · Evento Sinergia II", "Cierre · Reconocimiento a la Excelencia Técnica"], "administrativo": ["Planificación · Dimensionamiento y Metas de Negocio Agrícola", "Planificación · Negociación Bancaria", "Planificación · Oferta Proveedores", "Planificación · Compra y Asignación de Activos", "Planificación · Recolección de Documentación para Créditos", "Planificación · Corrida de Plan de Negocio y P&L por Agricultor", "Planificación · Entrega de Documentos Legales", "Planificación · Negociación y Cierre con Proveedores", "Ejecución · Monitoreo de P&L (rutina)", "Ejecución · Convenio con el Agricultor", "Ejecución · Liquidación de Crédito", "Ejecución · Actualización de Documentos - Movimientos de Maiz", "Ejecución · Definición de Mecanismo de Recaudo de Crédito en Cosecha", "Ejecución · Logística Interna de Arrime", "Cierre · Cierre de Proveedores", "Cierre · Cierre por Agricultor", "Cierre · Aprendizajes Proyecto Integral", "Cierre · Cierre Polar"], "operativo": ["Planificación · Levantamiento de polígono y delimitación de lotes", "Planificación · Plan de muestreo de suelo y toma de muestra en campo", "Siembra · Auditoría Transversal del Ciclo (rutina)", "Siembra · Descompactación, Nivelación y Drenaje", "Siembra · Encalado", "Siembra · Asignación de Insumos", "Siembra · Suministro de Insumos", "Siembra · Cierre de Inventario - Fase 1 (post-siembra)", "Siembra · Siembra", "Siembra · Análisis Foliar de Verificación", "Siembra · Control de Cultivo/Fumigación", "Siembra · Monitoreo", "Siembra · Reabono de Cultivo", "Cosecha · Cierre de Inventario - Fase 2 (antesala de cosecha)", "Cosecha · Estimación de Cosecha", "Cosecha · Cosecha", "Cosecha · Preparación Cosecha (maquinaria, insumos, gente)"]};
var PROCESOS_FASE = {"administrativo": {"Planificación": ["Dimensionamiento y Metas de Negocio Agrícola", "Negociación Bancaria", "Oferta Proveedores", "Compra y Asignación de Activos", "Recolección de Documentación para Créditos", "Corrida de Plan de Negocio y P&L por Agricultor", "Entrega de Documentos Legales", "Negociación y Cierre con Proveedores"], "Siembra": ["Monitoreo de P&L", "Convenio con el Agricultor", "Liquidación de Crédito"], "Cosecha": ["Actualización de Documentos - Movimientos de Maiz", "Definición de Mecanismo de Recaudo de Crédito en Cosecha", "Cierre de Proveedores", "Logística Interna de Arrime", "Cierre por Agricultor", "Aprendizajes Proyecto Integral", "Cierre Polar"]}, "operativo": {"Planificación": ["Levantamiento de polígono y delimitación de lotes", "Plan de muestreo de suelo y toma de muestra en campo"], "Siembra": ["Auditoría Transversal del Ciclo", "Descompactación, Nivelación y Drenaje", "Encalado", "Asignación de Insumos", "Suministro de Insumos", "Cierre de Inventario - Fase 1 (post-siembra)", "Siembra", "Análisis Foliar de Verificación", "Control de Cultivo/Fumigación", "Monitoreo", "Reabono de Cultivo"], "Cosecha": ["Cierre de Inventario - Fase 2 (antesala de cosecha)", "Estimación de Cosecha", "Cosecha", "Preparación Cosecha (maquinaria, insumos, gente)"]}, "procesos": {"Planificación": ["Captación de Productores", "Acuerdo de Especificación con Laboratorio", "Planificación Operativa Agrícola", "Análisis de suelo en laboratorio UCV", "Propuesta de Plan Agronómico", "Mesas Técnicas (Agricultor)", "Mesas Técnicas (Plan Agrícola)"], "Siembra": ["Mesas Técnicas del Ciclo"], "Cosecha": []}, "conocimiento": {"Planificación": ["Formaciones", "Planificación I+D"], "Siembra": ["Comunicación con el Productor", "Evento Sinergia I", "Preparación Siembra (maquinaria, insumos, gente)", "Siembra RDOE"], "Cosecha": ["Cosecha RDOE", "Cierre RDOE - Aprendizajes y Recomendaciones", "Evento Sinergia II", "Reconocimiento a la Excelencia Técnica"]}};
var AREAS = [['administrativo', 'Administrativo'], ['operativo', 'Operativo'], ['procesos', 'Procesos'], ['conocimiento', 'Conocimiento']];
var FASES = ['Planificación', 'Siembra', 'Cosecha'];
var NPS_KEYS = {'Planificación': 'nps_planificacion', 'Siembra': 'nps_siembra', 'Cosecha': 'nps_cosecha'};

/* ===== Estado y guardado automático ===== */
var state = {id: '', estado: 'borrador', step: 0};
var $ = function (id) { return document.getElementById(id); };
function uuid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
try { var saved = localStorage.getItem(DRAFT_KEY); if (saved) state = JSON.parse(saved); } catch (e) {}
if (!state.id) state.id = uuid();
state.step = state.step || 0;

var timer = null, pendiente = false, estadoTxt = '';
function persist() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {} }
function setMid(h) { $('mid').innerHTML = h; }
function touch() { persist(); pendiente = true; setMid('Guardando…'); clearTimeout(timer); timer = setTimeout(function () { enviar(); }, 1500); }
function enviar(final) {
  state.estado = final === true ? 'completa' : (state.estado === 'completa' ? 'completa' : 'borrador');
  return fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(state)})
    .then(function () { pendiente = false; setMid('<b>Guardado</b>'); return true; })
    .catch(function () { setMid('Guardado en tu dispositivo'); return false; });
}
window.addEventListener('online', function () { if (pendiente) enviar(); });

/* ===== Pasos ===== */
function nombreFase(f) { return f.toLowerCase(); }
function steps() {
  var a = state.area, s = [];
  s.push({k: 'intro', tipo: 'intro'});
  s.push({k: 'nombre', tipo: 'texto', t: '¿Cómo te llamas?', ph: 'Nombre y apellido'});
  s.push({k: 'area', tipo: 'area', t: '¿En qué área trabajas?'});
  if (!a) return s;
  FASES.forEach(function (f) { s.push({k: NPS_KEYS[f], tipo: 'nps', fase: f, t: '¿Recomendarías a otros proyectos el proceso de ' + nombreFase(f) + ' que ejecutaste este ciclo?'}); });
  s.push({k: 'bien', tipo: 'multi', t: '¿Cuáles 3 procesos funcionaron mejor?'});
  s.push({k: 'porque_bien', tipo: 'largo', t: '¿Por qué funcionaron bien?', ctx: 'bien'});
  s.push({k: 'mal', tipo: 'multi', t: '¿Cuáles 3 procesos tuvieron más problemas?'});
  s.push({k: 'porque_mal', tipo: 'largo', t: '¿Qué pasó?', ctx: 'mal'});
  s.push({k: 'reto', tipo: 'largo', t: '¿Cuál fue el mayor reto del ciclo?'});
  s.push({k: 'reto_fase', tipo: 'fase', t: '¿En qué fase ocurrió ese reto?'});
  s.push({k: 'reto_solucion', tipo: 'largo', t: '¿Cómo lo resolviste?', h: 'Si no lo resolviste, cuéntanos qué crees que podríamos hacer para mejorarlo el próximo año.'});
  s.push({k: 'distinto', tipo: 'largo', t: 'Si arrancáramos el ciclo de nuevo, ¿qué harías distinto?'});
  s.push({k: 'reconocer', tipo: 'largo', t: '¿A quién reconocerías y por qué?', h: 'Alguien cuyo aporte te ayudó a ti y al equipo este ciclo. Escribe su nombre y qué hizo.'});
  if (a === 'operativo') {
    s.push({k: 'op_programa', tipo: 'largo', t: '¿Qué es el programa Saturno en tus propias palabras?'});
    s.push({k: 'op_rol', tipo: 'texto', t: '¿Cuál es tu rol?', ph: 'Tu cargo o función'});
  }
  return s;
}
function valido(p) {
  var v = state[p.k];
  if (p.tipo === 'intro') return true;
  if (p.tipo === 'multi') return (v || []).length >= 1;
  if (p.tipo === 'nps') return v !== undefined && v !== '';
  return !!(v && String(v).trim());
}

/* ===== Dibujo ===== */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
var activo = null;
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

function dictado(ta, caja) {
  if (!SR) return;
  var b = el('button', 'mic'); b.type = 'button'; b.innerHTML = MIC + '<span>Dictar</span>';
  b.addEventListener('click', function () {
    if (activo) { activo.rec.stop(); if (activo.btn === b) return; }
    var rec = new SR(); rec.lang = 'es-VE'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = function (e) {
      var t = '';
      for (var i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript;
      if (t) { ta.value = (ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '') + t.trim(); ta.dispatchEvent(new Event('input')); }
    };
    rec.onend = function () { b.classList.remove('on'); b.querySelector('span').textContent = 'Dictar'; if (activo && activo.btn === b) activo = null; };
    rec.onerror = function () { rec.stop(); };
    activo = {rec: rec, btn: b};
    b.classList.add('on'); b.querySelector('span').textContent = 'Detener';
    try { rec.start(); } catch (err) {}
  });
  caja.appendChild(b);
}

function irSiguienteSoft(paso) {
  setTimeout(function () { if (state.step === paso && valido(steps()[paso])) siguiente(); }, 260);
}

function render() {
  if (activo) { try { activo.rec.stop(); } catch (e) {} activo = null; }
  var S = steps();
  if (state.step >= S.length) state.step = S.length - 1;
  var p = S[state.step], st = $('stage');
  st.innerHTML = '';
  var total = S.length - 1;
  $('count').textContent = p.tipo === 'intro' ? '' : 'Pregunta ' + state.step + (state.area ? ' de ' + total : '');
  $('bar').style.width = (state.area ? state.step / total * 100 : state.step * 4) + '%';
  $('back').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  var ultimo = state.step === S.length - 1 && state.area;
  $('next').textContent = p.tipo === 'intro' ? 'Empezar' : (ultimo ? 'Enviar' : 'Siguiente');

  if (p.tipo === 'intro') {
    st.appendChild(el('p', 'eyebrow', 'Polar · Ciclo 2026'));
    st.appendChild(el('h1', '', 'Cuéntanos cómo te fue en el ciclo'));
    st.appendChild(el('p', 'big', 'Son pocas preguntas y toman menos de 5 minutos. Con tus respuestas preparamos la sesión de aprendizajes.'));
    st.appendChild(el('p', 'hint', 'Lo que escribes se guarda solo: puedes cerrar y seguir después desde este mismo dispositivo.'));
  } else {
    st.appendChild(el('h1', '', p.t));
    if (p.h) st.appendChild(el('p', 'hint', p.h));
    if (p.tipo === 'texto') {
      var i = el('input'); i.type = 'text'; i.value = state[p.k] || ''; i.placeholder = p.ph || '';
      i.addEventListener('input', function () { state[p.k] = i.value; touch(); actualizarBoton(); });
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter' && valido(p)) siguiente(); });
      st.appendChild(i); setTimeout(function () { i.focus(); }, 50);
    } else if (p.tipo === 'largo') {
      if (p.ctx && (state[p.ctx] || []).length) {
        var c = el('div', 'chosen'); c.appendChild(el('b', '', 'Elegiste'));
        c.appendChild(document.createTextNode((state[p.ctx] || []).map(function (x) { return x.split(' · ').slice(1).join(' · '); }).join('; ')));
        st.appendChild(c);
      }
      var caja = el('div', 'row'), ta = el('textarea'); ta.value = state[p.k] || '';
      ta.addEventListener('input', function () { state[p.k] = ta.value; touch(); actualizarBoton(); });
      caja.appendChild(ta); dictado(ta, caja); st.appendChild(caja);
    } else if (p.tipo === 'area' || p.tipo === 'fase') {
      var opts = p.tipo === 'area' ? AREAS : FASES.map(function (f) { return [f, f]; });
      var g = el('div', 'choices' + (p.tipo === 'fase' ? ' one' : ''));
      opts.forEach(function (o) {
        var b = el('button', 'choice' + (state[p.k] === o[0] ? ' on' : ''), o[1]); b.type = 'button';
        b.addEventListener('click', function () {
          var cambio = state[p.k] !== o[0]; state[p.k] = o[0];
          if (p.tipo === 'area' && cambio) { state.bien = []; state.mal = []; }
          touch(); render(); irSiguienteSoft(state.step);
        });
        g.appendChild(b);
      });
      st.appendChild(g);
    } else if (p.tipo === 'nps') {
      var lista = PROCESOS_FASE[state.area][p.fase];
      var d = el('details'); d.appendChild(el('summary', '', 'Ver los procesos de tu área en esta fase'));
      d.appendChild(el('p', '', lista.length ? lista.join('; ') + '.' : 'Tu área no tiene procesos propios en esta fase. Califica los procesos del programa que viste en ella.'));
      st.appendChild(d);
      var sc = el('div', 'scale');
      for (var n = 0; n <= 10; n++) (function (n) {
        var b = el('button', String(state[p.k]) === String(n) ? 'on' : '', String(n)); b.type = 'button';
        b.addEventListener('click', function () { state[p.k] = String(n); touch(); render(); irSiguienteSoft(state.step); });
        sc.appendChild(b);
      })(n);
      st.appendChild(sc);
      var e = el('div', 'ends'); e.appendChild(el('span', '', '0 = no lo recomendaría')); e.appendChild(el('span', '', '10 = sí lo recomendaría')); st.appendChild(e);
    } else if (p.tipo === 'multi') {
      var sel = state[p.k] || [], cont = el('div', 'opts'), pick = el('p', 'pick');
      var grupo = '';
      (PROCESOS[state.area] || []).forEach(function (lab) {
        var parts = lab.split(' · '), fase = parts[0], nombre = parts.slice(1).join(' · ');
        if (fase !== grupo) { grupo = fase; cont.appendChild(el('div', 'grp', fase)); }
        var l = el('label', 'opt'), i2 = el('input'); i2.type = 'checkbox'; i2.value = lab; i2.checked = sel.indexOf(lab) >= 0;
        l.appendChild(i2); l.appendChild(el('span', '', nombre)); cont.appendChild(l);
      });
      var refrescar = function () {
        var marc = [].slice.call(cont.querySelectorAll('input:checked')).map(function (x) { return x.value; });
        state[p.k] = marc; pick.textContent = 'Elegidos: ' + marc.length + ' de 3';
        [].forEach.call(cont.querySelectorAll('.opt'), function (l) { var i3 = l.querySelector('input'), off = marc.length >= 3 && !i3.checked; i3.disabled = off; l.classList.toggle('off', off); });
      };
      cont.addEventListener('change', function () { refrescar(); touch(); actualizarBoton(); });
      st.appendChild(pick); st.appendChild(cont); refrescar();
    }
  }
  actualizarBoton();
  if (pendiente) setMid('Guardando…');
  $('stage').parentNode.scrollTop = 0;
}
function actualizarBoton() { var p = steps()[state.step]; $('next').disabled = !valido(p); }

function siguiente() {
  var S = steps(), p = S[state.step];
  if (!valido(p)) return;
  if (state.step === S.length - 1 && state.area) { terminar(); return; }
  state.step++; touch(); render();
}
function terminar() {
  var b = $('next'); b.disabled = true; b.textContent = 'Enviando…';
  enviar(true).then(function (ok) {
    if (!ok) { b.disabled = false; b.textContent = 'Enviar'; setMid('<span style="color:var(--bad)">No se pudo enviar. Tus respuestas están guardadas; inténtalo de nuevo con conexión.</span>'); return; }
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    $('nav').hidden = true; $('count').textContent = ''; $('bar').style.width = '100%';
    var st = $('stage'); st.innerHTML = '';
    var d = el('div', 'done'); d.appendChild(el('p', 'eyebrow', 'Listo'));
    d.appendChild(el('h1', '', 'Gracias, ' + (state.nombre || '').split(' ')[0]));
    d.appendChild(el('p', 'big', 'Recibimos tus respuestas. Nos vemos en la sesión de aprendizajes.'));
    st.appendChild(d);
  });
}
$('next').addEventListener('click', siguiente);
$('back').addEventListener('click', function () { if (state.step > 0) { state.step--; persist(); render(); } });

render();
</script>
</body>
</html>
